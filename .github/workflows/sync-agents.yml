name: Sync facility agents

on:
  schedule:
    - cron: '0 3 * * 1'  # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Hokusai-Agent
        run: |
          git clone --depth=1 https://github.com/RIKEN-RCCS/Hokusai-Agent.git /tmp/hokusai-src
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.claude-plugin/' \
            /tmp/hokusai-src/ hokusai/
          VER=$(grep '^version' hokusai/server/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          sed -i "s/\"version\": \".*\"/\"version\": \"$VER\"/" \
            hokusai/plugins/hokusai/.claude-plugin/plugin.json \
            hokusai/plugins/hokusai/.codex-plugin/plugin.json

      - name: Sync Rikyu-Agent
        run: |
          git clone --depth=1 https://github.com/RIKEN-RCCS/Rikyu-Agent.git /tmp/rikyu-src
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.claude-plugin/' \
            /tmp/rikyu-src/ rikyu/
          VER=$(grep '^version' rikyu/server/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          sed -i "s/\"version\": \".*\"/\"version\": \"$VER\"/" \
            rikyu/plugins/rikyu/.claude-plugin/plugin.json \
            rikyu/plugins/rikyu/.codex-plugin/plugin.json

      - name: Sync RCCS-CloudAgent
        run: |
          git clone --depth=1 https://github.com/william-dawson/RCCS-CloudAgent.git /tmp/rccs-src
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.claude-plugin/' \
            /tmp/rccs-src/ r-ccs-cloud/
          VER=$(grep '^version' r-ccs-cloud/server/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          sed -i "s/\"version\": \".*\"/\"version\": \"$VER\"/" \
            r-ccs-cloud/plugins/rccs-cloud/.claude-plugin/plugin.json \
            r-ccs-cloud/plugins/rccs-cloud/.codex-plugin/plugin.json

      - name: Sync Fugaku-Agent
        run: |
          git clone --depth=1 https://github.com/RIKEN-RCCS/Fugaku-Agent.git /tmp/fugaku-src
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.claude-plugin/' \
            /tmp/fugaku-src/ fugaku/
          VER=$(grep '^version' fugaku/server/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          sed -i "s/\"version\": \".*\"/\"version\": \"$VER\"/" \
            fugaku/plugins/fugaku/.claude-plugin/plugin.json \
            fugaku/plugins/fugaku/.codex-plugin/plugin.json

      - name: Normalize and validate Codex skill metadata
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          skills = sorted(Path(".").glob("*/plugins/*/skills/*/SKILL.md"))
          if not skills:
              raise SystemExit("no facility-agent skills found")

          for skill in skills:
              text = skill.read_text()
              if not text.startswith("---\n"):
                  paragraphs = re.split(r"\n\s*\n", text)
                  description = next(
                      (paragraph.replace("\n", " ").strip() for paragraph in paragraphs
                       if paragraph.strip() and not paragraph.lstrip().startswith("#")),
                      f"Guidance for the {skill.parent.name} workflow.",
                  )
                  frontmatter = (
                      "---\n"
                      f"name: {json.dumps(skill.parent.name)}\n"
                      f"description: {json.dumps(description)}\n"
                      "---\n\n"
                  )
                  skill.write_text(frontmatter + text)

              match = re.match(r"\A---\n(.*?)\n---(?:\n|\Z)", skill.read_text(), re.DOTALL)
              if match is None:
                  raise SystemExit(f"invalid frontmatter delimiters: {skill}")
              metadata = match.group(1).splitlines()
              for field in ("name", "description"):
                  values = [
                      line.partition(":")[2].strip()
                      for line in metadata
                      if line.startswith(f"{field}:")
                  ]
                  if not values or not values[0]:
                      raise SystemExit(f"missing {field}: {skill}")
                  if re.search(r"\s#", values[0]) and not values[0].startswith(("'", '"')):
                      raise SystemExit(f"unquoted YAML comment in {field}: {skill}")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hokusai/ rikyu/ r-ccs-cloud/ fugaku/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "sync: update Hokusai-Agent, Rikyu-Agent, RCCS-CloudAgent, and Fugaku-Agent mirrors"
            git push
          fi
