[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rccs-cloud-mcp"
version = "0.2.9"
description = "MCP servers for the RIKEN R-CCS Cloud: Slurm interaction and documentation search, built as a thin skin over hpc-agent-core."
requires-python = ">=3.10"
dependencies = [
    # Pinned exactly, not a range — see PORTING.md §9. Bump deliberately,
    # after re-running tests/smoke.py against the new version.
    "hpc-agent-core==0.4.9",
    # No direct "mcp" dependency — hpc_server.py/docs_server.py import
    # MCPServer from hpc_agent_core.mcp_server, the only place in the family
    # that depends on the MCP SDK directly (see its docstring for why).
]

[project.scripts]
rccs-cloud-hpc-mcp  = "cloud_mcp.hpc_server:main"
rccs-cloud-docs-mcp = "cloud_mcp.docs_server:main"
rccs-cloud-doctor   = "cloud_mcp.doctor:main"

[tool.setuptools.packages.find]
include = ["cloud_mcp*"]

[tool.setuptools.package-data]
cloud_mcp = [
    "data/*.json",
    "data/*.md",
    "data/docs_index/*",
]
