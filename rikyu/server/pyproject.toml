[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rikyu-mcp"
version = "0.5.2"
description = "MCP servers for the RIKEN Rikyu supercomputer: Slurm interaction and documentation search."
license = {text = "AGPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
requires-python = ">=3.10"
dependencies = [
    # Pinned exactly, not a range — see PORTING.md §9. Bump deliberately,
    # after re-running tests/smoke.py against the new version; don't just
    # widen the ceiling.
    "hpc-agent-core==0.4.9",
]

[project.scripts]
rikyu-hpc-mcp = "rikyu_mcp.hpc_server:main"
rikyu-docs-mcp = "rikyu_mcp.docs_server:main"
rikyu-doctor = "rikyu_mcp.doctor:main"

[tool.setuptools.packages.find]
include = ["rikyu_mcp*"]

[tool.setuptools.package-data]
rikyu_mcp = [
    "data/*.json",
    "data/*.md",
    "data/docs_index/*",
]
